<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <!-- Fuentes de Google para la tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="../css/styles.css">
    <!-- Icono de la pestaña -->
    <link rel="icon" type="image/png" href="../img/favicon.png">
</head>
<body>

    <!-- Contenedor principal de la página -->
    <div class="container">
        <!-- Tarjeta del formulario de contacto -->
        <div class="form-card">
            <h2>Contacto</h2>
            <p class="subtitle">Envíanos tu mensaje y te responderemos pronto</p>

            <!-- Formulario de contacto -->
            <form id="contactForm" novalidate>

                <!-- Campo para el nombre -->
                <div class="input-group" id="group-name">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" name="name" placeholder="Tu nombre completo">
                    <span class="error-msg">El nombre es obligatorio.</span>
                </div>

                <!-- Campo para el email -->
                <div class="input-group" id="group-email">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="tu@correo.com">
                    <span class="error-msg">El email es obligatorio.</span>
                </div>

                <!-- Área de texto para el mensaje -->
                <div class="input-group" id="group-message">
                    <label for="message">Mensaje</label>
                    <textarea id="message" name="message" rows="4" placeholder="Escribe tu mensaje aquí..." maxlength="500"></textarea>
                    <div style="text-align: right; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem;" id="charCount">0/500</div>
                    <span class="error-msg">El mensaje no puede estar vacío.</span>
                </div>

                <!-- Botón para enviar el formulario -->
                <button type="submit">Enviar Mensaje</button>

                <!-- Mensaje de éxito al enviar -->
                <div id="successMessage" class="success-msg">
                    Mensaje enviado con éxito
                </div>
                
                <!-- Opción para volver atrás -->
                <div class="switch-form">
                    <p><a href="../index.html">Volver atrás</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- Pie de página semántico -->
    <footer class="site-footer" style="text-align: center; padding: 2rem; margin-top: auto; border-top: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; font-size: 0.875rem;">
        <p>&copy; 2026 Inmobiliaria POC. Todos los derechos reservados.</p>
    </footer>

    <!-- Lógica y validación del formulario de contacto -->
    <script>
        const messageInput = document.getElementById('message');
        const charCount = document.getElementById('charCount');
        
        messageInput.addEventListener('input', () => {
            const currentLength = messageInput.value.length;
            charCount.textContent = `${currentLength}/500`;
            document.getElementById('group-message').classList.remove('error');
        });
        
        document.getElementById('name').addEventListener('input', () => {
            document.getElementById('group-name').classList.remove('error');
        });
        
        document.getElementById('email').addEventListener('input', () => {
            document.getElementById('group-email').classList.remove('error');
        });

        function validarDatos(formElement) {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = messageInput.value.trim();
            
            const groupName = document.getElementById('group-name');
            const groupEmail = document.getElementById('group-email');
            const groupMessage = document.getElementById('group-message');
            
            // Limpiar errores
            groupName.classList.remove('error');
            groupEmail.classList.remove('error');
            groupMessage.classList.remove('error');
            
            let isValid = true;
            
            if (!name) {
                groupName.classList.add('error');
                isValid = false;
            }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email) {
                groupEmail.classList.add('error');
                groupEmail.querySelector('.error-msg').textContent = 'El email es obligatorio.';
                isValid = false;
            } else if (!emailRegex.test(email)) {
                groupEmail.classList.add('error');
                groupEmail.querySelector('.error-msg').textContent = 'Ingresa un email válido.';
                isValid = false;
            }
            
            if (!message) {
                groupMessage.classList.add('error');
                isValid = false;
            }
            
            if (isValid) {
                // Guardar los datos en un array dentro de localStorage
                const contactData = {
                    name: name,
                    email: email,
                    message: message,
                    date: new Date().toISOString()
                };
                
                let contactMessages = JSON.parse(localStorage.getItem('contactMessages') || '[]');
                contactMessages.push(contactData);
                localStorage.setItem('contactMessages', JSON.stringify(contactMessages));

                document.getElementById('successMessage').style.display = 'block';
                formElement.reset();
                charCount.textContent = '0/500';
                setTimeout(() => {
                    document.getElementById('successMessage').style.display = 'none';
                }, 3000);
            }
        }

        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            validarDatos(this);
        });
    </script>
</body>
</html>
