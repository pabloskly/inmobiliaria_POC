<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | Inicio</title>
    <!-- Fuentes de Google para la tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="../css/styles.css">
    <!-- Icono de la pestaña -->
    <link rel="icon" type="image/png" href="../img/favicon.png">
</head>
<body>

    <!-- Contenedor principal de la página -->
    <div class="container">
        <!-- Tarjeta del formulario -->
        <div class="form-card">
            <h2>Bienvenido de nuevo</h2>
            <p class="subtitle">Ingresa tus credenciales</p>

            <!-- Formulario de ingreso -->
            <form id="loginForm" novalidate>
                <!-- Campo para el correo electrónico -->
                <div class="input-group" id="group-email">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                    <span class="error-msg">Ingresa un correo válido.</span>
                </div>

                <!-- Campo para la contraseña -->
                <div class="input-group" id="group-password">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Tu contraseña">
                    <span class="error-msg">Ingresa tu contraseña.</span>
                </div>

                <!-- Botón para enviar el formulario -->
                <button type="submit">Ingresar</button>

                <!-- Mensaje de éxito al completar el registro -->
                <div id="successMessage" class="success-msg">
                    Ingreso exitoso. Redirigiendo...
                </div>

                <!-- Opción para ir al registro si no tiene cuenta -->
                <div class="switch-form">
                    <p>¿No tienes una cuenta? <a href="registro.html">Regístrate</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- Pie de página semántico -->
    <footer class="site-footer" style="text-align: center; padding: 2rem; margin-top: auto; border-top: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; font-size: 0.875rem;">
        <p>&copy; 2026 Inmobiliaria POC. Todos los derechos reservados.</p>
    </footer>

    <!-- Lógica de validación del formulario de ingreso -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            const groupEmail = document.getElementById('group-email');
            const groupPassword = document.getElementById('group-password');
            
            // Limpiar errores previos
            groupEmail.classList.remove('error');
            groupPassword.classList.remove('error');
            
            let isValid = true;
            
            if (!email) {
                groupEmail.classList.add('error');
                groupEmail.querySelector('.error-msg').textContent = 'Ingresa tu correo electrónico.';
                isValid = false;
            }
            
            if (!password) {
                groupPassword.classList.add('error');
                groupPassword.querySelector('.error-msg').textContent = 'Ingresa tu contraseña.';
                isValid = false;
            }
            
            if (!isValid) return;
            
            // Obtener usuarios registrados
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            
            // Buscar usuario con email y contraseña coincidentes
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                // Guardar estado de sesión
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userName', user.fullname);
                
                // Mostrar éxito y redirigir
                document.getElementById('successMessage').style.display = 'block';
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 1500);
            } else {
                groupEmail.classList.add('error');
                groupPassword.classList.add('error');
                groupEmail.querySelector('.error-msg').textContent = 'Credenciales incorrectas.';
                groupPassword.querySelector('.error-msg').textContent = 'Credenciales incorrectas.';
            }
        });

        // Limpiar errores al escribir
        document.getElementById('email').addEventListener('input', () => {
            document.getElementById('group-email').classList.remove('error');
        });
        document.getElementById('password').addEventListener('input', () => {
            document.getElementById('group-password').classList.remove('error');
        });
    </script>
</body>
</html>
