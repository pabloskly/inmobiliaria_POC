<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | Inicio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <div class="container">
        <div class="form-card">
            <h2>Bienvenido de nuevo</h2>
            <p class="subtitle">Ingresa tus credenciales</p>

            <form id="loginForm" novalidate>
                <div class="input-group" id="group-email">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                    <span class="error-msg">Ingresa un correo válido.</span>
                </div>

                <div class="input-group" id="group-password">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Tu contraseña">
                    <span class="error-msg">Ingresa tu contraseña.</span>
                </div>

                <button type="submit">Ingresar</button>

                <div class="switch-form">
                    <p>¿No tienes una cuenta? <a href="index.html">Regístrate</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            // Simulación simple de validación
            if(email && password) {
                // Redirige al formulario de contacto
                window.location.href = 'contacto.html';
            } else {
                alert('Por favor, ingresa tus credenciales.');
            }
        });
    </script>
</body>
</html>
