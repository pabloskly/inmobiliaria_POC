<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <div class="container">
        <div class="form-card">
            <h2>Cambiar Contraseña</h2>
            <p class="subtitle">Actualiza tu credencial de acceso</p>

            <form id="changePasswordForm" novalidate>
                <!-- Contraseña Actual -->
                <div class="input-group" id="group-current-password">
                    <label for="currentPassword">Contraseña Actual</label>
                    <input type="password" id="currentPassword" name="currentPassword" placeholder="Tu contraseña actual">
                    <span class="error-msg">Ingresa tu contraseña actual.</span>
                </div>

                <!-- Nueva Contraseña -->
                <div class="input-group" id="group-new-password">
                    <label for="newPassword">Nueva Contraseña</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Al menos 8 caracteres">
                    <span class="error-msg">La contraseña debe tener al menos 8 caracteres.</span>
                </div>

                <!-- Confirmar Nueva Contraseña -->
                <div class="input-group" id="group-confirm-password">
                    <label for="confirmPassword">Confirmar Nueva Contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu nueva contraseña">
                    <span class="error-msg">Las contraseñas no coinciden.</span>
                </div>

                <button type="submit">Actualizar Contraseña</button>

                <div id="successMessage" class="success-msg">
                    Contraseña actualizada con éxito
                </div>
                
                <div class="switch-form">
                    <p><a href="../index.html">Volver al inicio</a></p>
                </div>
            </form>
        </div>
    </div>

    <footer class="site-footer" style="text-align: center; padding: 2rem; margin-top: auto; border-top: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; font-size: 0.875rem;">
        <p>&copy; 2026 Inmobiliaria POC. Todos los derechos reservados.</p>
    </footer>

    <script>
        // Funciones auxiliares para mostrar/limpiar errores
        const showError = (inputElement, message) => {
            const group = inputElement.parentElement;
            group.classList.add('error');
            const errorMsg = group.querySelector('.error-msg');
            if (message) errorMsg.textContent = message;
        };

        const clearError = (inputElement) => {
            const group = inputElement.parentElement;
            group.classList.remove('error');
        };

        document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const currentPasswordInput = document.getElementById('currentPassword');
            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            
            let isValid = true;
            
            // Validar que el usuario haya iniciado sesión
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const userEmail = localStorage.getItem('userEmail');
            
            if (!isLoggedIn || !userEmail) {
                alert("Debes iniciar sesión para cambiar tu contraseña.");
                window.location.href = '../index.html';
                return;
            }

            // Obtener usuarios
            let users = JSON.parse(localStorage.getItem('users') || '[]');
            const userIndex = users.findIndex(u => u.email === userEmail);
            
            if (userIndex === -1) {
                alert("Usuario no encontrado.");
                return;
            }
            
            const user = users[userIndex];

            // Validar contraseña actual
            if (!currentPasswordInput.value) {
                showError(currentPasswordInput, 'Ingresa tu contraseña actual.');
                isValid = false;
            } else if (currentPasswordInput.value !== user.password) {
                showError(currentPasswordInput, 'La contraseña actual es incorrecta.');
                isValid = false;
            } else {
                clearError(currentPasswordInput);
            }

            // Validar nueva contraseña
            const newPasswordValue = newPasswordInput.value;
            const uppercaseRegex = /[A-Z]/;
            const numberRegex = /[0-9]/;
            const specialCharRegex = /[^A-Za-z0-9]/;
            
            if (newPasswordValue.length < 8) {
                showError(newPasswordInput, 'La contraseña debe tener al menos 8 caracteres.');
                isValid = false;
            } else if (!uppercaseRegex.test(newPasswordValue)) {
                showError(newPasswordInput, 'Debe contener al menos una letra mayúscula.');
                isValid = false;
            } else if (!numberRegex.test(newPasswordValue)) {
                showError(newPasswordInput, 'Debe contener al menos un número.');
                isValid = false;
            } else if (!specialCharRegex.test(newPasswordValue)) {
                showError(newPasswordInput, 'Debe contener al menos un carácter especial.');
                isValid = false;
            } else {
                clearError(newPasswordInput);
            }

            // Validar confirmación
            if (!confirmPasswordInput.value) {
                showError(confirmPasswordInput, 'Confirma tu nueva contraseña.');
                isValid = false;
            } else if (confirmPasswordInput.value !== newPasswordValue) {
                showError(confirmPasswordInput, 'Las contraseñas no coinciden.');
                isValid = false;
            } else {
                clearError(confirmPasswordInput);
            }

            // Si todo es válido, actualizar
            if (isValid) {
                users[userIndex].password = newPasswordValue;
                localStorage.setItem('users', JSON.stringify(users));
                
                document.getElementById('successMessage').style.display = 'block';
                this.reset();
                
                setTimeout(() => {
                    document.getElementById('successMessage').style.display = 'none';
                    window.location.href = '../index.html';
                }, 2000);
            }
        });

        // Limpiar errores al escribir
        ['currentPassword', 'newPassword', 'confirmPassword'].forEach(id => {
            const input = document.getElementById(id);
            input.addEventListener('input', () => clearError(input));
        });
    </script>
</body>
</html>
