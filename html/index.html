<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Inicio</title>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <div class="container">
        <div class="form-card">
            <h2>Crear una cuenta</h2>
            <p class="subtitle">Ingresa tus datos para registrarte</p>

            <form id="registerForm" novalidate>
                <div class="input-group" id="group-fullname">
                    <label for="fullname">Nombre Completo</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Tu nombre completo">
                    <span class="error-msg">El nombre completo es obligatorio.</span>
                </div>

                <div class="input-group" id="group-username">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Tu nombre de usuario">
                    <span class="error-msg">El usuario es obligatorio.</span>
                </div>

                <div class="input-group" id="group-email">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                    <span class="error-msg">Ingresa un correo electrónico válido.</span>
                </div>

                <div class="input-group" id="group-password">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Al menos 8 caracteres">
                    <span class="error-msg">La contraseña debe tener al menos 8 caracteres.</span>
                </div>

                <div class="input-group" id="group-confirm-password">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña">
                    <span class="error-msg">Las contraseñas no coinciden.</span>
                </div>

                <button type="submit">Registrarse</button>

                <div class="switch-form">
                    <p>¿Ya tienes una cuenta? <a href="login.html">Ingresar</a></p>
                </div>

                <div id="successMessage" class="success-msg">
                    ¡Registro exitoso!
                </div>
            </form>
        </div>
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
